name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/HueStudio.Core.Tests

  windows-app:
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish Hue Studio (x64, self-contained)
        run: dotnet publish src/HueStudio.App -c Release -p:Platform=x64 -o publish/HueStudio-win-x64
      - name: Smoke test - app must still be running after 15s
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/HueStudio-win-x64/HueStudio.exe
          if (-not (Test-Path publish/HueStudio-win-x64/HueStudio.pri)) { throw "HueStudio.pri missing from publish output" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          $log = Join-Path $env:LOCALAPPDATA "HueStudio/crash.log"
          if (Test-Path $log) { Get-Content $log; throw "App logged a crash on start-up" }
          if ($p.HasExited) { throw "App exited during start-up (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Hue Studio started and stayed up."
      - uses: actions/upload-artifact@v5
        with:
          name: HueStudio-win-x64
          path: publish/HueStudio-win-x64
